appId: de.kandleos.app
productName: KandleOS
directories:
  output: release
files:
  - out/**
  - package.json
# Shipped next to the app (resources/), opened from the "Über KandleOS" dialog.
extraResources:
  - from: resources/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  # Bridge to TradingAgents for the KI-Analyse; Python and TradingAgents themselves are installed on first use.
  - from: resources/agents/kandleos_agents.py
    to: agents/kandleos_agents.py
  - from: resources/agents/requirements.lock
    to: agents/requirements.lock
# Hardening of the packaged Electron binary: no "run as plain Node", no Node debugging/option injection,
# app code only from the (integrity-checked) app.asar, encrypted cookies.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true

win:
  target: nsis
  icon: resources/icon.png
  # onnxruntime-node ships native libraries for every OS; keep only this target's (saves ~150 MB).
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v*/{linux,darwin}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
nsis:
  artifactName: KandleOS-Setup-${version}.${ext}
  oneClick: false
  perMachine: false # per-user install, no admin rights needed
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

linux:
  # tar.gz can also be built on Windows; it ships install.sh + icon for a per-user install.
  target: [AppImage, deb, tar.gz]
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v*/{win32,darwin}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/linux/arm64/**'
  extraFiles:
    - from: linux/install.sh
      to: install.sh
    - from: resources/icon.png
      to: icon.png
  icon: resources/icon.png
  category: Office
  syncDesktopName: true # window <-> launcher icon association (WM_CLASS / Wayland app_id)
  synopsis: Technische Chartanalyse
  artifactName: KandleOS-${version}-${arch}.${ext}
