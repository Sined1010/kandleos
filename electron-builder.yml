appId: de.kandleos.app
productName: KandleOS
directories:
  output: release
files:
  - out/**
  - package.json
  - resources/icon.png # window icon, loaded by src/main/index.ts
# Shipped next to the app (resources/), opened from the "Über KandleOS" dialog.
extraResources:
  # KandleOS itself is GPL-3.0-or-later; the license text must travel with every copy.
  - from: LICENSE
    to: LICENSE.txt
  - from: resources/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  # Bridge to TradingAgents for the KI-Analyse; Python and TradingAgents themselves are installed on first use.
  - from: resources/agents/kandleos_agents.py
    to: agents/kandleos_agents.py
  - from: resources/agents/requirements.lock
    to: agents/requirements.lock
  - from: resources/agents/build-constraints.txt
    to: agents/build-constraints.txt
# Hardening of the packaged Electron binary: no "run as plain Node", no Node debugging/option injection,
# app code only from the (integrity-checked) app.asar, encrypted cookies.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
# Electron itself is checked against the checksums of the electron npm package (node_modules/electron/checksums.json),
# not only against SHASUMS256.txt from the same GitHub release as the zip. Copy both lines anew with every Electron
# update; a missing or wrong entry stops the build. Without unsafelyDisableChecksums electron-builder drops the list.
electronDownload:
  unsafelyDisableChecksums: false
  checksums:
    electron-v44.9.3-win32-x64.zip: 41a1ffa0541cb0f2c9b9fe920dd2cef1793ad0ea2ada1a9582958880f4d1b23c
    electron-v44.9.3-linux-x64.zip: 6e7fd2d450d442507b846ace4ae6e2bd17e1b1653e86a033b5231abfc23e6df4

win:
  target: nsis
  icon: resources/icon.png
  # onnxruntime-node ships native libraries for every OS; keep only this target's (saves ~150 MB).
  files:
    # A list of only "!" patterns makes electron-builder add "**/*" (the whole project folder); this keeps it to out/.
    - out/**
    - '!node_modules/onnxruntime-node/bin/napi-v*/{linux,darwin}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
    # DirectML and its shader compiler (Microsoft's own licence terms) are for GPU inference; the forecast runs on the
    # CPU and never loads them (checked: only onnxruntime.dll and the binding are loaded).
    - '!node_modules/onnxruntime-node/bin/napi-v*/win32/x64/{DirectML,dxcompiler,dxil}.dll'
nsis:
  artifactName: KandleOS-Setup-${version}.${ext}
  oneClick: false
  perMachine: false # per-user install, no admin rights needed
  # Setup never asks for admin rights itself; "for all users" needs it started as admin.
  allowElevation: false
  allowToChangeInstallationDirectory: true
  # Removes the phone-pairing firewall rule on uninstall.
  include: windows/installer.nsh
  createDesktopShortcut: always
  createStartMenuShortcut: true

linux:
  # tar.gz can also be built on Windows; it ships install.sh + icon for a per-user install.
  target: [AppImage, deb, tar.gz]
  files:
    - out/** # see win.files
    - '!node_modules/onnxruntime-node/bin/napi-v*/{win32,darwin}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/linux/arm64/**'
    # GPU providers (~270 MB), fetched by onnxruntime's install script when building on Linux; the forecast runs on the CPU.
    - '!node_modules/onnxruntime-node/bin/napi-v*/linux/x64/libonnxruntime_providers_{cuda,tensorrt}.so'
  extraFiles:
    - from: linux/install.sh
      to: install.sh
    # The SVG, not icon.png: an extraFiles source is left out of app.asar, where the main process loads icon.png.
    - from: resources/icon.svg
      to: icon.svg
  icon: resources/icon.png
  category: Office
  syncDesktopName: true # window <-> launcher icon association (WM_CLASS / Wayland app_id)
  synopsis: Technische Chartanalyse
  artifactName: KandleOS-${version}-${arch}.${ext}
appImage:
  # No --no-sandbox in the menu entry: AppRun itself adds it only where user namespaces are blocked.
  executableArgs: []
