appId: de.kandleos.app
productName: KandleOS
directories:
  output: release
files:
  - out/**
  - package.json

win:
  target: nsis
  icon: resources/icon.png
nsis:
  artifactName: KandleOS-Setup-${version}.${ext}
  oneClick: false
  perMachine: false # per-user install, no admin rights needed
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

linux:
  # tar.gz can also be built on Windows; it ships install.sh + icon for a per-user install.
  target: [AppImage, deb, tar.gz]
  extraFiles:
    - from: linux/install.sh
      to: install.sh
    - from: resources/icon.png
      to: icon.png
  icon: resources/icon.png
  category: Office
  syncDesktopName: true # window <-> launcher icon association (WM_CLASS / Wayland app_id)
  synopsis: Technische Chartanalyse
  artifactName: KandleOS-${version}-${arch}.${ext}
