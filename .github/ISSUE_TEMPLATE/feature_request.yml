name: Feature request
description: An idea for KandleOS
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you want to achieve, not only the button you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? Screenshots from other tools are welcome.
  - type: dropdown
    id: platform
    attributes:
      label: Where?
      multiple: true
      options:
        - Desktop (Windows / Linux)
        - Android
